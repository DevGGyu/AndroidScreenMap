<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 상단 바 / 좌측 레이어 패널 / 중앙 그래프 캔버스 / 우측 상세 패널(좁은 화면에서는 하단 시트) */
:root {
  --bg: #f2f4f7; --panel: #ffffff; --panel-2: #f7f8fa; --ink: #14181f; --muted: #566070; --line: #d8dde5;
  --accent: #2a78d6; --focus: #2a78d6; --edge: #8a94a3; --edge-hi: #2a78d6;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --gray: #7b8594;
  --syn-cm: #6a7585; --syn-kw: #6250d6; --syn-st: #1a7f4b; --syn-an: #b45309; --syn-nu: #0f6aa8; --code-bg: #f3f5f8;
  --detail-w: 330px;
  --font: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1217; --panel: #161b22; --panel-2: #1b2129; --ink: #e8ebf0; --muted: #9aa5b4; --line: #29313b;
    --accent: #3987e5; --focus: #3987e5; --edge: #6b7685; --edge-hi: #3987e5;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --gray: #8a95a5; color-scheme: dark;
    --syn-cm: #8b97a8; --syn-kw: #a99cf0; --syn-st: #5fcf94; --syn-an: #e9a35a; --syn-nu: #6cb4ea; --code-bg: #10151b;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1217; --panel: #161b22; --panel-2: #1b2129; --ink: #e8ebf0; --muted: #9aa5b4; --line: #29313b;
  --accent: #3987e5; --focus: #3987e5; --edge: #6b7685; --edge-hi: #3987e5;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --gray: #8a95a5; color-scheme: dark;
  --syn-cm: #8b97a8; --syn-kw: #a99cf0; --syn-st: #5fcf94; --syn-an: #e9a35a; --syn-nu: #6cb4ea; --code-bg: #10151b;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--font); display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 12px; }

header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.prov { color: var(--muted); font-size: 12px; min-width: 0; }
.prov b { font-weight: 500; color: var(--ink); }
.spacer { flex: 1 1 0; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel-2); padding: 4px 10px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
#side-toggle { display: none; }

.shell { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr) var(--detail-w); }
body.wide-detail { --detail-w: min(780px, 56vw); }
aside { background: var(--panel); overflow-y: auto; min-height: 0; padding: 12px 16px 16px max(16px, env(safe-area-inset-left, 0px)); }
#side { border-right: 1px solid var(--line); }
#detail { border-left: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-left: 16px; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 16px 0 6px; }
aside h2:first-child { margin-top: 0; }
#search { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
#hits { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 1px; }
#hits button { width: 100%; text-align: left; background: transparent; border: 0; padding: 3px 6px; border-radius: 4px; display: flex; gap: 6px; align-items: center; }
#hits button:hover { background: var(--panel-2); }

.row { display: flex; align-items: center; gap: 8px; padding: 2px 0; min-width: 0; }
.row label { display: flex; align-items: center; gap: 8px; flex: 1 1 0; min-width: 0; cursor: pointer; }
.row .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.sw { width: 16px; height: 16px; flex: none; }
.sw svg { display: block; width: 16px; height: 16px; }
.note { color: var(--muted); font-size: 12px; }
.ln { width: 28px; height: 0; border-top: 2px solid var(--edge); flex: none; }
.ln.dashed { border-top-style: dashed; }
.ln.dotted { border-top-style: dotted; }

#stage { position: relative; min-width: 0; min-height: 0; }
#cy { position: absolute; inset: 0; }
#status { position: absolute; left: 12px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#zoom { position: absolute; right: 12px; top: 12px; display: grid; gap: 4px; }
#zoom button { width: 32px; height: 32px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); font-size: 16px; line-height: 1; }
#zoom button:hover { border-color: var(--accent); }
#focusbar { position: absolute; left: 12px; top: 12px; right: 56px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
#focusbar > * { pointer-events: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; max-width: 100%; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); padding: 3px 8px; border-radius: 4px; font-size: 12px; max-width: 360px; display: none; }

#detail h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.kindtag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 2px 10px; margin: 10px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.group { margin: 12px 0 0; }
.group > .gh { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.links { display: flex; flex-wrap: wrap; gap: 4px; }
.links button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; padding: 1px 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.links button:hover { border-color: var(--accent); }
.links button.dashed { border-style: dashed; }
.links button.dotted { border-style: dotted; }
.pill { font-size: 11px; border-radius: 999px; padding: 0 7px; border: 1px solid var(--line); color: var(--muted); }
.snip { margin-top: 8px; }
.snhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; min-width: 0; }
.snhead .mono { color: var(--muted); overflow-wrap: anywhere; }
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 0; overflow: auto; max-height: 360px;
  font: 11.5px/1.55 var(--mono); tab-size: 4; white-space: pre; }
pre.code.full { max-height: 68vh; }
pre.code .l { display: block; padding: 0 10px 0 0; min-width: max-content; }
pre.code .n { display: inline-block; width: 4.2ch; margin-right: 10px; text-align: right; color: var(--muted); opacity: .7; user-select: none; font-variant-numeric: tabular-nums; position: sticky; left: 0; background: var(--code-bg); padding-right: 6px; }
.cm { color: var(--syn-cm); font-style: italic; } .kw { color: var(--syn-kw); } .st { color: var(--syn-st); } .an { color: var(--syn-an); } .nu { color: var(--syn-nu); }
.more { margin-top: 4px; width: 100%; }
#scrape { display: inline-flex; align-items: center; gap: 8px; }
#scrape .st { color: var(--muted); font-size: 12px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#joblog { position: absolute; left: 12px; bottom: 44px; width: min(560px, calc(100% - 24px)); max-height: 40%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; display: none; }
#joblog.show { display: block; }
.perf { margin-top: 12px; }
.perf table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
.perf th, .perf td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.perf th { color: var(--muted); font-weight: 500; font-size: 11px; }
.perf td.num, .perf th.num { text-align: right; }
.perf .tr { font-family: var(--mono); font-size: 11.5px; }
.perf .span { color: var(--muted); font-size: 11.5px; margin: 2px 0 6px; }
.up { color: var(--c8); } .down { color: var(--c6); }
.empty { color: var(--muted); padding: 24px 0; }
.empty b { color: var(--ink); font-weight: 500; }
.copy { margin-left: 6px; padding: 0 6px; font-size: 11px; }

@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  #side { position: fixed; z-index: 15; left: 0; top: 0; bottom: 0; width: min(300px, 88vw); transform: translateX(-102%); transition: transform .18s; padding-top: 56px; }
  body.show-side #side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  #side-toggle { display: inline-block; }
  body.wide-detail { --detail-w: 330px; }
  #detail { position: fixed; z-index: 12; left: 0; right: 0; bottom: 0; max-height: 46%; border-left: 0; border-top: 1px solid var(--line); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: none; }
  body.has-sel #detail { display: block; }
  #status { bottom: auto; top: 54px; }
}
@media (prefers-reduced-motion: reduce) { #side { transition: none; } }
</style>
<!--HEAD-END-->
<header>
  <button id="side-toggle" class="btn" type="button" aria-label="레이어 패널 열기">레이어</button>
  <h1>__TITLE__</h1>
  <div class="prov" id="prov"></div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="집중 보기 단계">

    <button type="button" data-depth="2" aria-pressed="false">2단계</button>
    <button type="button" data-depth="3" aria-pressed="false">3단계</button>
  </div>
  <button id="reset" class="btn" type="button">전체 보기</button>
  <span id="scrape"><button id="scrape-btn" class="btn" type="button" title="Firebase Performance 콘솔에서 트레이스 수치를 읽어 지도에 반영합니다 (Chrome 창이 2~3분 떴다 닫힘)">Firebase 성능 긁어오기</button><span class="st" id="scrape-st"></span></span>
</header>
<div class="shell">
  <aside id="side">
    <h2>검색</h2>
    <input id="search" type="search" placeholder="화면·VM·API 이름, 경로" autocomplete="off" aria-label="노드 검색">
    <ul id="hits"></ul>
    <h2>노드 종류</h2>
    <div id="kinds"></div>
    <h2>연결 종류</h2>
    <div id="edgekinds"></div>
    <h2>신뢰도</h2>
    <div class="row"><span class="ln"></span><span>코드에서 직접 파싱</span></div>
    <div class="row"><label><input type="checkbox" id="opt-heur" checked><span class="ln dashed"></span><span>추정 (패키지 근접)</span></label></div>
    <div class="row"><label><input type="checkbox" id="opt-dyn"><span class="ln dotted"></span><span>동적 (런타임 결정)</span></label></div>
    <h2>성능 계측</h2>
    <div class="row"><span class="sw"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2" fill="none" stroke="var(--ink)" stroke-width="1.2"/><rect x="4" y="5" width="8" height="6" rx="1" fill="none" stroke="var(--ink)" stroke-width="1.2"/></svg></span><span>이중 테두리 = Firebase 트레이스 있음 <span class="n" id="instr-n"></span></span></div>
    <p class="note" id="perf-meta"></p>
    <h2>옵션</h2>
    <div class="row"><label><input type="checkbox" id="opt-debug"><span>디버그 화면 포함</span></label></div>
    <p class="note">노드를 클릭하면 상세, 더블클릭하면 그 노드 중심으로 펼칩니다. 우측 상세의 연결 버튼으로 그래프를 따라 걸을 수 있습니다.</p>
  </aside>
  <main id="stage">
    <div id="cy" role="img" aria-label="__TITLE__ — 화면·딥링크·API 관계 그래프"></div>
    <div id="focusbar"></div>
    <div id="zoom">
      <button id="zin" type="button" aria-label="확대">+</button>
      <button id="zout" type="button" aria-label="축소">−</button>
      <button id="zfit" type="button" aria-label="화면에 맞추기">⤢</button>
    </div>
    <div id="joblog" aria-live="polite"></div>
    <div id="status" aria-live="polite"></div>
  </main>
  <aside id="detail" aria-live="polite"></aside>
</div>
<div id="tip"></div>

    if (location.protocol === 'file:') { btn.disabled = true; st.textContent = '로컬 서버로 열면 동작'; return; }
    var timer = null;
    function poll() {
      fetch('/scrape/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
        logEl.textContent = (s.log || []).slice(-40).join('\n'); logEl.classList.add('show'); logEl.scrollTop = logEl.scrollHeight;
        if (s.running) { st.textContent = '긁는 중… (Chrome 창이 떴다 닫힙니다)'; return; }
        clearInterval(timer); timer = null; btn.disabled = false;
        if (s.exit === 0 && s.built) { st.textContent = '완료 — 새로고침합니다'; setTimeout(function () { location.reload(); }, 900); }
        else if (s.exit != null) { st.textContent = s.hint || ('실패(코드 ' + s.exit + ') — 로그 확인'); }  // 서버가 /scrape/status 의 hint 로 안내문을 준다
      }).catch(function () { st.textContent = '로컬 서버 응답 없음'; clearInterval(timer); timer = null; btn.disabled = false; });
    }
    btn.addEventListener('click', function () {
      btn.disabled = true; st.textContent = '시작…'; logEl.textContent = ''; logEl.classList.add('show');
      fetch('/scrape', { method: 'POST' }).then(function (r) {
        if (r.status === 409) { st.textContent = '이미 실행 중'; }
        timer = setInterval(poll, 1500); poll();
      }).catch(function () { st.textContent = '로컬 서버 응답 없음'; btn.disabled = false; });
    });
    logEl.addEventListener('dblclick', function () { logEl.classList.remove('show'); });
    fetch('/scrape/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) { if (s.running) { btn.disabled = true; timer = setInterval(poll, 1500); poll(); } }).catch(function () {});
  })();

  // ── 이벤트 ──
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.kind) { KINDS[t.dataset.kind].on = t.checked; apply(true); }
    else if (t.dataset && t.dataset.ekind) { EDGES[t.dataset.ekind].on = t.checked; apply(true); }
    else if (t.id === 'opt-heur') { state.heur = t.checked; apply(true); }
    else if (t.id === 'opt-dyn') { state.dyn = t.checked; apply(true); }
    else if (t.id === 'opt-debug') { state.debug = t.checked; apply(true); }
  });
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.go) { focusOn(b.dataset.go); }
    else if (b.dataset.focus) { focusOn(state.sel, +b.dataset.focus); }
    else if (b.dataset.depth) { state.depth = +b.dataset.depth; syncDepth(); if (state.focus) apply(true); }
    else if (b.dataset.more) {
      var pre = b.previousElementSibling, i = +b.dataset.more, total = +b.dataset.total, full = pre.classList.toggle('full');
      pre.innerHTML = full ? codeHtml(state.sel, i, 0, total) : codeHtml(state.sel, i, 0, PREVIEW);
      b.textContent = full ? '접기' : '전체 보기 (' + total + '줄)'; if (!full) pre.scrollTop = 0;
    }
    else if (b.dataset.copycode) { var cx = codeOf(state.sel)[+b.dataset.copycode], t0 = b.textContent;
      try { navigator.clipboard.writeText(cx.s).then(function () { b.textContent = '복사됨'; setTimeout(function () { b.textContent = t0; }, 1200); }, function () {}); } catch (e) {} }
    else if ('wide' in b.dataset) { var w = document.body.classList.toggle('wide-detail'); b.textContent = w ? '폭 좁게 ↔' : '폭 넓게 ↔'; }
    else if (b.dataset.copy) { var done = function () { b.textContent = '복사됨'; setTimeout(function () { b.textContent = '복사'; }, 1200); };
      try { navigator.clipboard.writeText(b.dataset.copy).then(done, function () {}); } catch (e) {} }
    else if (b.id === 'reset') { resetView(); }
    else if (b.id === 'zin') { cy.zoom({ level: cy.zoom() * 1.3, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } }); }
    else if (b.id === 'zout') { cy.zoom({ level: cy.zoom() / 1.3, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } }); }
    else if (b.id === 'zfit') { cy.fit(cy.elements().not('.hidden'), 40); }
    else if (b.id === 'side-toggle') { document.body.classList.toggle('show-side'); }
  });
  cy.on('tap', 'node', function (e) { select(e.target.id()); });
  cy.on('dbltap', 'node', function (e) { focusOn(e.target.id()); });
  cy.on('tap', function (e) { if (e.target === cy) select(null); });
  var tip = $('tip');
  cy.on('mouseover', 'node', function (e) {
    var n = NODE[e.target.id()]; tip.textContent = (n.kind === 'endpoint' ? n.verb + ' ' + n.path : n.label.replace(/\n/g, ' ')) + ' · ' + KINDS[n.kind].label; tip.style.display = 'block';
  });
  cy.on('mousemove', 'node', function (e) { tip.style.left = (e.originalEvent.clientX + 12) + 'px'; tip.style.top = (e.originalEvent.clientY + 14) + 'px'; });
  cy.on('mouseout', 'node', function () { tip.style.display = 'none'; });
  document.addEventListener('click', function (ev) { if (document.body.classList.contains('show-side') && !ev.target.closest('#side') && ev.target.id !== 'side-toggle') document.body.classList.remove('show-side'); });

  var search = $('search'), hits = $('hits');
  var INDEX = DATA.nodes.map(function (n) { return { id: n.id, t: ((n.kind === 'endpoint' ? n.verb + ' ' + n.path + ' ' + n.api + '.' + n.fun : n.label) + ' ' + (n.fqcn || '')).toLowerCase() }; });
  function doSearch() {
    var q = search.value.trim().toLowerCase();
    if (!q) { hits.innerHTML = ''; return; }
    var m = INDEX.filter(function (x) { return x.t.indexOf(q) >= 0; }).slice(0, 14);
    hits.innerHTML = m.map(function (x) { var n = NODE[x.id]; return '<li><button type="button" data-go="' + esc(x.id) + '"><span class="sw">' + shapeSvg(n.kind) + '</span><span>' + esc(shortLabel(n)) + '</span></button></li>'; }).join('') || '<li class="note">일치하는 노드 없음</li>';
  }
  search.addEventListener('input', doSearch);
  search.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { var f = hits.querySelector('button'); if (f) f.click(); } });

  // 디버깅·검증용: 현재 상태 요약(콘솔)
  window.__screenMap = { cy: cy, state: state, focusOn: focusOn, resetView: resetView };
  apply(true); renderDetail();
})();
</script>
