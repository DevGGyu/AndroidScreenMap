[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "android-screen-map"
version = "0.1.0"
description = "Screen · deeplink · API map of an Android (Kotlin) app, rendered as one self-contained HTML file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["android", "kotlin", "architecture", "visualization", "deeplink", "retrofit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.scripts]
screenmap = "screenmap.cli:main"

[tool.setuptools]
packages = ["screenmap"]

[tool.setuptools.package-data]
screenmap = ["viewer.template.html"]
